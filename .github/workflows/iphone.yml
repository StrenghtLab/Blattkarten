name: iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [iphone-build]
    paths:
      - iPhone/**
      - Worksheet.swift
      - LearningProgress.swift
      - .github/workflows/iphone.yml

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone IPA
        run: ./iPhone/build-ipa.sh "$RUNNER_TEMP/Blattkarten-iPhone.ipa"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blattkarten-iPhone
          path: ${{ runner.temp }}/Blattkarten-iPhone.ipa
          if-no-files-found: error

      - name: Publish AltStore Classic preview
        if: github.ref_name == 'iphone-build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view iphone-v1.0 >/dev/null 2>&1; then
            gh release upload iphone-v1.0 "$RUNNER_TEMP/Blattkarten-iPhone.ipa"
          else
            gh release create iphone-v1.0 "$RUNNER_TEMP/Blattkarten-iPhone.ipa" \
              --target "$GITHUB_SHA" --title "Blattkarten für iPhone 1.0" --prerelease \
              --notes "iPhone-Testversion ab iOS 16. Die IPA ist für den Import in AltStore Classic vorgesehen."
          fi
